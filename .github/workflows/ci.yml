name: CI

on:
  pull_request:
    branches: [qa, main]
  push:
    branches: [qa, main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore HotelManagement.sln

      - name: Build
        run: dotnet build HotelManagement.sln --no-restore -c Release

      - name: Test
        run: dotnet test HotelManagement.sln --no-build -c Release --verbosity normal
